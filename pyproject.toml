[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fido2-node-bench"
version = "0.5.0"
description = "Host and Zephyr experiments for a node-resident FIDO2 subsystem"
requires-python = ">=3.10"
dependencies = ["fido2==2.0.0", "pyserial==3.5", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
gpio = ["gpiozero>=2,<3", "lgpio>=0.2"]

[project.scripts]
fido-bench = "fido_bench.cli:main"

[tool.setuptools.packages.find]
where = ["host"]
